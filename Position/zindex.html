<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1
        {
            height: 350px;
            width: 350px;
            background-color: aqua;
            position: relative;
            z-index: 2;
        }
          .box2
        {
            height: 350px;
            width: 350px;
            background-color: yellow;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
        }
    </style>
</head>
<body>
    
    <div class="box1">1</div>
    <div class="box2">2</div>


</body>
</html>
