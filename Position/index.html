<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *
       {
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
       }
       .banner
       {
            height: 100vh;
            width: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEjnbSoVphz20JInsBfiSh6pvHGWbinZt9UTEK8cfn3jz5oLafFbaRFEE&s=10');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
       }

       .form
       {
            height: 400px;
            width: 400px;
            /* From https://css.glass */
            background: rgba(255, 255, 255, 0);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.99);
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
       }
       .form h3
       {
            color: white;
            text-align: center;
            padding: 20px 0px;
            font-family: arial;
       }
       .content
       {
            height: 300px;
            width: 300px;
            /* background-color: aqua; */
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 52%;
       }
       .content input
       {
            width: 100%;
            height: 40px;
            background-color: white;
            outline: none;
            border: none;
            margin: 10px 0px;
       }
       ::placeholder
       {
         text-align: center;
       }    
       a
       {
            border: 1px solid transparent;
            width: 100%;
            display: block;
            padding: 10px 0px;
            text-align: center;
            color:white;
            text-decoration: none;
            background-color: red;
       }
       a:hover
       {
            background-color: white;
            color:red;
       }
    </style>
</head>
<body>
    
    <!-- Position : Static (default), relative (parent), absolute (child), sticky, fixed -->

    
    <div class="banner">

        <div class="form">
            <h3>Login Form</h3>

            <div class="content">
                <input type="text" placeholder="Enter Your Name">

                <input type="text" placeholder="Enter Your Email">

                <input type="text" placeholder="Enter Your Password">

                <a href="">Login</a>
            </div>

        </div>


    </div>


</body>
</html>
