<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        .banner
        {
            height: 550px;
            width: 80%;
            margin: auto;
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .box1
        {
            height: 400px;
            width: 32%;
            background-color: aqua;
        }
        .box2
        {
            height: 400px;
            width: 32%;
            background-color: yellow;
        }
        .box3
        {
            height: 400px;
            width: 32%;
            background-color: green;
        }
        .box1 img
        {
            height: 400px;
            width: 100%;
            filter: grayscale(100);
            transition: 0.7s;
        }
        .box1 img:hover
        {
            filter: grayscale(0);
        }
         .box2 img
        {
            height: 400px;
            width: 100%;
            filter: grayscale(100);
            transition: 0.7s;
        }
           .box2 img:hover
        {
            filter: grayscale(0);
        }
         .box3 img
        {
            height: 400px;
            width: 100%;
            filter: grayscale(100);
            transition: 0.7s;
        }
           .box3 img:hover
        {
            filter: grayscale(0);
        }
    </style>
</head>
<body>
    

    <div  class="banner">
        <div class="box1">
            <img src="https://static.toiimg.com/thumb/msid-48096267,width=1200,height=900/48096267.jpg" alt="">
        </div>
        <div class="box2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQT0gdZPaQyL9wNU_m7EU_NGdL-AO4V-oyC_k2-pW924A&s=10" alt="">
        </div>
        <div class="box3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMhBr0js4mOHs37cLYguIAy1AOk2_Jv6JjfGY1EBDHpA&s=10" alt="">
        </div>
    </div>

</body>
</html>
